<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>StreamClipper – TikTok-Anmeldung</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; line-height: 1.6; color: #222; }
    textarea { width: 100%; height: 120px; font: 14px monospace; padding: 8px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    .ok { color: #15803d; font-weight: 600; }
    .err { color: #b91c1c; font-weight: 600; }
  </style>
</head>
<body>
  <h1>TikTok-Anmeldung</h1>
  <p id="msg">Kopiere diese komplette Adresse und füge sie in clipqueue unter „TikTok verbinden“ ein.</p>
  <textarea id="url" readonly></textarea>
  <button id="copy">Adresse kopieren</button>
  <p id="done"></p>
  <script>
    var box = document.getElementById("url");
    box.value = window.location.href;
    var p = new URLSearchParams(window.location.search);
    if (p.get("error")) {
      document.getElementById("msg").innerHTML =
        '<span class="err">TikTok meldet einen Fehler: ' + (p.get("error_description") || p.get("error")) + '</span>';
    } else if (!p.get("code")) {
      document.getElementById("msg").textContent =
        "Diese Seite wird nach der TikTok-Anmeldung aufgerufen. Hier ist noch kein Code angekommen.";
    }
    document.getElementById("copy").onclick = function () {
      box.select();
      try { navigator.clipboard.writeText(box.value); } catch (e) { document.execCommand("copy"); }
      document.getElementById("done").innerHTML = '<span class="ok">Kopiert – jetzt in clipqueue einfügen.</span>';
    };
  </script>
</body>
</html>
